<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>MBA 备考中心</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  body {
    font-family: "Segoe UI", "Microsoft YaHei", -apple-system, sans-serif;
    background: linear-gradient(180deg, #eef3fb 0%, #f4f6fa 240px);
    color: #1e293b;
    min-height: 100vh;
    display: flex; flex-direction: column; align-items: center;
    padding: 0 18px env(safe-area-inset-bottom);
  }
  .hero { text-align: center; padding: 72px 0 40px; }
  .hero h1 { font-size: 30px; font-weight: 700; letter-spacing: 1px; color: #0f172a; }
  .hero h1 .accent { color: #1d4ed8; }
  .hero p { margin-top: 12px; font-size: 14.5px; color: #64748b; }
  .cards { display: flex; gap: 22px; flex-wrap: wrap; justify-content: center; width: 100%; max-width: 780px; }
  a.card {
    flex: 1 1 300px; max-width: 360px;
    background: #fff; border: 1px solid #e2e8f0; border-radius: 16px;
    padding: 30px 28px 26px; text-decoration: none; color: inherit;
    box-shadow: 0 1px 3px rgba(15,23,42,.05);
    transition: transform .15s, box-shadow .15s, border-color .15s;
    display: block;
  }
  a.card:hover {
    transform: translateY(-3px);
    border-color: #93c5fd;
    box-shadow: 0 10px 26px rgba(29,78,216,.13);
  }
  .card .icon {
    width: 52px; height: 52px; border-radius: 13px;
    display: flex; align-items: center; justify-content: center;
    margin-bottom: 18px;
  }
  .card.exam .icon { background: #eff6ff; }
  .card.essay .icon { background: #f0fdf4; }
  .card .icon svg { width: 27px; height: 27px; }
  .card h2 { font-size: 19px; font-weight: 650; margin-bottom: 9px; color: #0f172a; }
  .card p { font-size: 13.5px; line-height: 1.7; color: #64748b; }
  .card .go {
    margin-top: 18px; font-size: 13.5px; font-weight: 600; color: #1d4ed8;
    display: inline-flex; align-items: center; gap: 5px;
  }
  .card.essay .go { color: #16a34a; }
  .card .go::after { content: "→"; transition: transform .15s; }
  a.card:hover .go::after { transform: translateX(3px); }
  footer { margin-top: auto; padding: 42px 0 26px; font-size: 12px; color: #94a3b8; text-align: center; }
  .topbar {
    width: 100%; max-width: 820px;
    display: flex; justify-content: flex-end; padding-top: 16px;
  }
  .chip {
    font-size: 13px; color: #475569; background: #fff;
    border: 1px solid #e2e8f0; border-radius: 999px;
    padding: 6px 14px; display: inline-flex; align-items: center; gap: 8px;
  }
  .chip b { font-weight: 650; color: #0f172a; }
  .chip a { color: #1d4ed8; text-decoration: none; font-weight: 600; }
  .chip a:hover { text-decoration: underline; }
  .chip .sep { color: #cbd5e1; }
  @media (max-width: 480px) {
    .hero { padding: 52px 0 30px; }
    .hero h1 { font-size: 24px; }
    a.card { flex-basis: 100%; max-width: none; }
  }
</style>
</head>
<body>

<div class="topbar">
  <span id="acct-chip" class="chip"></span>
</div>

<div class="hero">
  <h1>MBA <span class="accent">备考中心</span></h1>
  <p>管理类联考 · 英语（二）自用工具集</p>
</div>

<div class="cards">
  <a class="card exam" href="exam/index.html">
    <div class="icon">
      <svg viewBox="0 0 24 24" fill="none" stroke="#1d4ed8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/>
        <path d="M14 2v6h6"/>
        <path d="M9 13h6M9 17h4"/>
      </svg>
    </div>
    <h2>真题模拟</h2>
    <p>管理类联考（199）与英语二（204）历年真题，全真计时、自动判分、逐题解析与薄弱点诊断。</p>
    <span class="go">开始模考</span>
  </a>

  <a class="card essay" href="essay.html">
    <div class="icon">
      <svg viewBox="0 0 24 24" fill="none" stroke="#16a34a" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/>
        <path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/>
        <path d="M9 7h7M9 11h5"/>
      </svg>
    </div>
    <h2>英语作文背诵助手</h2>
    <p>作文模板与范文管理，按复习计划循环背诵，随手记录、随时回看。</p>
    <span class="go">去背诵</span>
  </a>
</div>

<footer>MBA 备考中心 · 自用工具，内容加密存放，请勿外传</footer>

<script src="auth.js"></script>
<script>
(function () {
  const chip = document.getElementById('acct-chip');
  const u = window.MBAAuth && MBAAuth.user();
  if (u) {
    // 已登录：显示账号 + 退出（退出后留在首页，再进功能页会要求重新登录）
    chip.innerHTML = '当前账号 <b></b> <span class="sep">|</span> <a href="#" id="logout">退出登录</a>';
    chip.querySelector('b').textContent = u;
    chip.querySelector('#logout').onclick = (e) => {
      e.preventDefault();
      MBAAuth.logout();
      location.reload();
    };
  } else {
    // 未登录：功能页会先跳登录页，这里给个主动入口
    chip.innerHTML = '未登录 <span class="sep">|</span> <a href="login.html">登录</a>';
  }
})();
</script>

</body>
</html>
