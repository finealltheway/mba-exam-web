<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MBA 模拟考试系统</title>
<style>
:root{
  /* 底色：冷调中性，避免纯灰发闷 */
  --bg:#eef4fa; --card:#fff; --line:#dce7f2; --line2:#c3d5e8;
  --tx:#1c2b3a; --tx2:#4a5f75; --tx3:#7d93a8;
  /* 主色：沉稳的商务蓝（比原来更亮更干净） */
  --blue:#1f6fc4; --blue-bg:#e8f2fd; --blue-deep:#155a9e;
  /* 状态色 */
  --green:#0d7a63; --green-bg:#e2f6f1;
  --red:#c93a3a; --red-bg:#fdecec;
  --amber:#b06a12; --amber-bg:#fdf1df;
  --purple:#5b52c9; --purple-bg:#eeedfe;
  /* 交互态：统一用蓝色微底色，替换原来的暖灰 */
  --hover:#e3eefa; --hover2:#eaf3fc; --track:#dde9f5;
  --sh:0 1px 2px rgba(28,43,58,.05),0 4px 14px rgba(31,111,196,.07);
  --sh-lift:0 3px 8px rgba(28,43,58,.07),0 10px 26px rgba(31,111,196,.13);
  --r:10px;
  /* 顶部固定栏高度：桌面实测 63px。窄屏 header 会换行变高，
     下面用 @media 覆写，并在地 exam-bar 里引用它做 sticky 偏移——
     不要在多处写死像素，否则窄屏必然对不齐、被 header 盖住。 */
  --hdr:63px;
}
*{box-sizing:border-box;margin:0;padding:0}
body{
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
  background:var(--bg); color:var(--tx); font-size:14px; line-height:1.6;
  -webkit-font-smoothing:antialiased;
}
button{font-family:inherit;font-size:14px;cursor:pointer;border:none;background:none;color:inherit}
input,textarea,select{font-family:inherit;font-size:14px;color:inherit}

.wrap{max-width:1180px;margin:0 auto;padding:0 20px}
header{
  background:var(--card);border-bottom:1px solid var(--line);
  padding:18px 0;position:sticky;top:0;z-index:50;
  box-shadow:0 1px 3px rgba(31,111,196,.06);
}
header .wrap{display:flex;align-items:center;gap:20px}
h1{font-size:17px;font-weight:600;letter-spacing:-.2px}
.sub{font-size:12px;color:var(--tx3);margin-top:1px}
nav{margin-left:auto;display:flex;gap:4px}
nav button{
  padding:7px 14px;border-radius:7px;font-size:13px;color:var(--tx2);
  transition:background .12s,color .12s;
}
nav button:hover{background:var(--hover);color:var(--tx)}
nav button.on{background:var(--blue);color:#fff;box-shadow:0 2px 8px rgba(31,111,196,.28)}

.page{display:none;padding:26px 0 60px}
.page.on{display:block}

.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:22px;box-shadow:var(--sh)}
.card+.card{margin-top:16px}
.card h2{font-size:15px;font-weight:600;margin-bottom:4px}
.card .hint{font-size:13px;color:var(--tx2);margin-bottom:16px}

.btn{
  padding:9px 18px;border-radius:7px;font-size:14px;font-weight:500;
  background:var(--blue);color:#fff;transition:box-shadow .15s,transform .15s,background .15s;
  box-shadow:0 2px 6px rgba(31,111,196,.25);
}
.btn:hover{background:var(--blue-deep);transform:translateY(-1px);box-shadow:0 4px 12px rgba(31,111,196,.32)}
.btn.ghost{background:var(--card);color:var(--tx);border:1px solid var(--line2)}
.btn.ghost:hover{background:var(--hover)}
.btn.sm{padding:6px 12px;font-size:13px}
.btn:disabled{opacity:.4;cursor:not-allowed}

.subj-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:16px}

/* 未完成考试提示卡（断点续答入口） */
.resume-card{
  background:linear-gradient(180deg,#f2f9ff 0%,var(--blue-bg) 100%);
  border:1px solid var(--line);border-left:3px solid var(--blue);
}
.resume-row{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.resume-ico{
  width:34px;height:34px;border-radius:9px;flex-shrink:0;
  background:var(--blue);position:relative;
}
/* 用两条白色竖条画个「暂停」记号 */
.resume-ico::before,.resume-ico::after{
  content:'';position:absolute;top:9px;width:4px;height:16px;border-radius:2px;background:#fff;
}
.resume-ico::before{left:10px}
.resume-ico::after{left:20px}
.resume-txt{flex:1;min-width:180px}
.resume-txt b{font-size:14.5px;font-weight:600;color:var(--tx)}
.resume-txt .sub{margin-top:3px}
.resume-act{display:flex;gap:8px;flex-shrink:0}

/* 答题页的「已自动保存」提示条 */
.autosave{
  font-size:12px;color:var(--tx3);display:inline-flex;align-items:center;gap:5px;
}
.autosave .ico{
  width:7px;height:7px;border-radius:50%;background:var(--green);flex-shrink:0;
}
.autosave.saving .ico{background:var(--amber)}
.subj{
  background:var(--card);border:1px solid var(--line);border-radius:var(--r);
  padding:20px;cursor:pointer;box-shadow:var(--sh);
  transition:border-color .15s,transform .15s,box-shadow .15s;
}
.subj:hover{border-color:var(--blue);transform:translateY(-2px);box-shadow:var(--sh-lift)}
.subj h3{font-size:15px;font-weight:600;margin-bottom:2px}
.subj h3 .sugg{font-size:12px;font-weight:400;color:var(--tx3);margin-left:4px;white-space:nowrap}
.subj .code{font-size:12px;color:var(--tx3);margin-bottom:14px}
.subj .meta{display:flex;gap:16px;font-size:12px;color:var(--tx2);margin-bottom:16px}
.subj .meta b{display:block;font-size:17px;font-weight:600;color:var(--tx)}
.struct{font-size:12px;color:var(--tx2);border-top:1px solid var(--line);padding-top:12px}
.struct div{display:flex;justify-content:space-between;padding:2px 0}

/* 科目卡：双模式（随机 / 指定年份真题） */
.subj-acts{margin-top:14px;border-top:1px solid var(--line);padding-top:12px;
  display:flex;flex-direction:column;gap:10px}
.mode-tabs{display:flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;width:max-content}
.mode-tabs .mt{border:none;background:transparent;padding:6px 14px;font-size:12px;
  color:var(--tx2);cursor:pointer;transition:background .15s,color .15s}
.mode-tabs .mt.on{background:var(--blue);color:#fff}
.year-row{display:none;align-items:center;gap:8px}
.subj.year-mode .year-row{display:flex}
.yr-sel{flex:1;min-width:0;padding:7px 10px;font-size:13px;color:var(--tx);
  background:var(--bg);border:1px solid var(--line);border-radius:8px;cursor:pointer}
.yr-sel:focus{outline:none;border-color:var(--blue)}
.mode-hint{font-size:11.5px;color:var(--tx3)}

/* 考试页 */
.exam-bar{
  background:var(--card);border-bottom:1px solid var(--line);
  padding:12px 0;position:sticky;top:var(--hdr);z-index:40;
  box-shadow:0 1px 3px rgba(31,111,196,.05);
}
.exam-bar .wrap{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.timer{
  font-variant-numeric:tabular-nums;font-size:19px;font-weight:600;
  padding:4px 12px;border-radius:7px;background:var(--blue-bg);color:var(--blue);
}
.timer.warn{background:var(--amber-bg);color:var(--amber)}
.timer.over{background:var(--red-bg);color:var(--red);animation:pulse 1.2s infinite}
@keyframes pulse{50%{opacity:.55}}
/* 点空位编号跳题后的落点闪烁：外环由实变虚，正常阴影全程保留 */
@keyframes qflash{
  from{box-shadow:0 0 0 3px var(--blue),var(--sh)}
  to{box-shadow:0 0 0 0 var(--blue),var(--sh)}
}
.qcard.flash{animation:qflash 1.3s ease-out}
.prog{font-size:13px;color:var(--tx2)}
.prog b{color:var(--tx);font-weight:600}
.exam-actions{margin-left:auto;display:flex;gap:8px}

.qnav{
  display:flex;flex-wrap:wrap;gap:5px;padding:14px 0;
  border-bottom:1px solid var(--line);margin-bottom:20px;
}
.qn{
  width:30px;height:30px;border-radius:6px;border:1px solid var(--line2);
  font-size:12px;color:var(--tx2);display:flex;align-items:center;justify-content:center;
  transition:all .1s;
}
.qn:hover{border-color:var(--blue);background:var(--hover2)}
.qn.done{background:var(--blue-bg);border-color:var(--blue);color:var(--blue);font-weight:500}
.qn.cur{border-color:var(--blue);border-width:1.5px;color:var(--blue);font-weight:600;background:var(--hover2)}
.qn.writing{background:var(--hover)}

.qcard{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:24px;margin-bottom:16px;box-shadow:var(--sh)}
/* 滚动落点避开顶部两条固定栏（header + exam-bar）：题号导航跳题、
   定位空位、点空位编号跳题都走 scrollIntoView，没有这段落点会被
   钉在固定栏下面。窄屏 --hdr 被 JS 置 0，自动只剩答题栏的高度。 */
.qcard,.article-block{scroll-margin-top:calc(var(--hdr) + 60px)}
.qhead{display:flex;align-items:baseline;gap:10px;margin-bottom:14px;flex-wrap:wrap}
.qno{font-size:15px;font-weight:600}
.qtag{font-size:11px;padding:2px 8px;border-radius:20px;background:var(--blue-bg);color:var(--blue)}
.qtime{font-size:12px;color:var(--tx3);margin-left:auto;font-variant-numeric:tabular-nums}
.stem{font-size:15px;line-height:1.75;margin-bottom:16px;white-space:pre-wrap}
.stem .blank{display:inline-block;min-width:52px;border-bottom:1px solid var(--tx3)}
.sect-head{
  font-size:12.5px;color:var(--tx2);font-weight:500;
  padding:20px 0 10px;border-bottom:1px solid var(--line);margin-bottom:14px;
}
.article-block{
  background:linear-gradient(180deg,#f6faff 0%,var(--blue-bg) 100%);
  border:1px solid var(--line);border-left:3px solid var(--blue);border-radius:10px;
  margin-bottom:16px;overflow:hidden;box-shadow:var(--sh);
}
.art-head{
  display:flex;align-items:center;gap:9px;padding:11px 15px;
  font-size:13px;cursor:default;
}
.article-block .pico{width:13px;height:10px;border:1.5px solid var(--blue);border-radius:2px;flex-shrink:0}
.art-title{font-weight:500;color:var(--tx)}
.art-meta{font-size:11px;color:var(--tx3)}
.art-toggle{
  margin-left:auto;font-size:12px;color:var(--blue);
  padding:3px 10px;border:1px solid var(--line2);border-radius:6px;
}
.art-toggle:hover{background:var(--hover)}
.art-body{
  padding:0 15px 15px;font-size:13.5px;line-height:1.85;color:var(--tx);
  max-height:340px;overflow:auto;white-space:pre-wrap;
  border-top:1px solid var(--line);padding-top:13px;
}
/* 正文段落：段间留出一整行空白（段落分隔来自题库里的 \n\n） */
.art-p{margin:0 0 1em;text-indent:2em}
.art-p:last-child{margin-bottom:0}
.art-back{
  font-size:11px;color:var(--blue);padding:2px 8px;border-radius:5px;
  background:var(--blue-bg);margin-right:8px;
}
.art-back:hover{opacity:.8}
/* 完形填空：文章中的空位编号 + 题头的空位提示与定位按钮 */
.cloze-blank{
  display:inline-block;min-width:20px;padding:0 3px;margin:0 2px;
  text-align:center;color:var(--blue);font-weight:600;
  border-bottom:1.5px solid var(--blue);
  cursor:pointer;border-radius:3px;
}
.cloze-blank:hover{background:var(--hover)}
/* 已答的空位：编号后带已选字母，绿色底一眼看得出做过、选了什么 */
.cloze-blank.done{background:var(--green-bg);color:var(--green);border-bottom-color:var(--green)}
.cloze-blank.done i{font-style:normal;font-weight:700;margin-left:1px;color:var(--tx)}
.cloze-blank.active{
  background:var(--blue);color:#fff;border-radius:3px;
  border-bottom-color:transparent;
}
.cloze-blank.active i{color:#fff}
.blank-hint{
  font-size:11px;color:var(--blue);background:var(--blue-bg);
  padding:2px 7px;border-radius:5px;font-weight:500;
}
.blank-jump{
  font-size:11px;color:var(--blue);padding:2px 8px;border-radius:5px;
  background:var(--blue-bg);margin-right:8px;
}
.blank-jump:hover{opacity:.8}
.qimg{
  width:100%;border:1px solid var(--line);border-radius:8px;
  margin-bottom:16px;background:#fff;box-shadow:var(--sh);
}
/* 英语大作文的图表：原图不大，铺满全宽会发虚，限一下宽度并居中 */
.qimg.chart{max-width:620px;display:block;margin:0 auto 18px}
.opts{display:flex;flex-direction:column;gap:9px}
.opts.compact{flex-direction:row;gap:8px;flex-wrap:wrap}
.opts.compact .opt{padding:0;width:46px;height:40px;justify-content:center}
.opts.compact .opt .k{width:24px;height:24px;margin:0}
.opt{
  display:flex;gap:11px;padding:12px 14px;border:1px solid var(--line);
  border-radius:8px;cursor:pointer;transition:all .12s;align-items:flex-start;
}
.opt:hover{border-color:var(--blue);background:var(--hover2)}
.opt.sel{border-color:var(--blue);background:var(--blue-bg);box-shadow:0 0 0 3px rgba(31,111,196,.10)}
.opt .k{
  width:22px;height:22px;border-radius:50%;border:1px solid var(--line2);
  display:flex;align-items:center;justify-content:center;font-size:12px;
  font-weight:600;flex-shrink:0;margin-top:1px;
}
.opt.sel .k{background:var(--blue);border-color:var(--blue);color:#fff}
.opt .v{flex:1;font-size:14px;line-height:1.6}
.opt.right{border-color:var(--green);background:var(--green-bg)}
.opt.right .k{background:var(--green);border-color:var(--green);color:#fff}
.opt.wrong{border-color:var(--red);background:var(--red-bg)}
.opt.wrong .k{background:var(--red);border-color:var(--red);color:#fff}
.opt.lock{cursor:default}

textarea.writing{
  width:100%;min-height:260px;padding:14px;border:1px solid var(--line);
  border-radius:8px;resize:vertical;line-height:1.8;
}
textarea.writing:focus{outline:none;border-color:var(--blue)}
.wc{font-size:12px;color:var(--tx3);text-align:right;margin-top:5px}

.selfscore{display:flex;align-items:center;gap:10px;margin-top:14px;flex-wrap:wrap}
.selfscore input{
  width:70px;padding:6px 9px;border:1px solid var(--line2);border-radius:6px;
  transition:border-color .12s,box-shadow .12s;
}
.selfscore input:focus{outline:none;border-color:var(--blue);box-shadow:0 0 0 3px rgba(31,111,196,.13)}

/* 翻译题自动评分：按钮 + 官方口径明细面板 */
.trans-bar{display:flex;align-items:center;gap:10px;margin:10px 0 4px;flex-wrap:wrap}
.trans-btn{
  font-size:12.5px;color:#fff;background:var(--blue);
  padding:6px 15px;border-radius:7px;font-weight:500;
}
.trans-btn:hover{opacity:.88}
.trans-hint{font-size:12px;color:var(--tx3)}
.trans-panel{
  background:var(--hover2);border:1px solid var(--line);border-radius:9px;
  padding:13px 16px;margin:8px 0 4px;font-size:12.5px;
}
.tp-head{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap}
.tp-score{font-size:23px;font-weight:700;color:var(--blue);line-height:1}
.tp-score span{font-size:12px;color:var(--tx3);font-weight:400}
.tp-tier{font-size:12px;color:var(--tx2)}
.tp-cov{font-size:11.5px;color:var(--tx3);margin-left:auto}
.tp-ded{color:var(--amber);font-size:12px;margin:8px 0 2px;line-height:1.7}
.tp-warn{color:var(--blue);font-size:12px;margin:8px 0 2px;line-height:1.7}
.tg{border-top:1px dashed var(--line2);padding:8px 0 5px}
.tg-h{display:flex;gap:8px;align-items:baseline}
.tg-i{color:var(--blue);font-weight:600;font-size:11.5px;flex-shrink:0}
.tg-en{color:var(--tx3);font-size:11px;flex:1;min-width:0}
.tg-s{font-size:11.5px;color:var(--tx2);font-weight:600;flex-shrink:0}
.tg-p{display:flex;flex-wrap:wrap;gap:4px 8px;margin-top:5px}
.tp{font-size:11.5px;padding:1px 7px;border-radius:5px;cursor:help}
.tp.ok{color:var(--green);background:var(--green-bg)}
.tp.miss{color:var(--tx3);background:var(--hover)}
.tp.neg{color:var(--red);background:var(--red-bg)}
.tp-foot{font-size:11px;color:var(--tx3);border-top:1px dashed var(--line2);margin-top:9px;padding-top:8px;line-height:1.65}

/* 结果页 */
.score-hero{
  background:linear-gradient(180deg,#fafdff 0%,var(--card) 60%);
  border:1px solid var(--line);border-radius:var(--r);
  padding:28px;text-align:center;margin-bottom:16px;box-shadow:var(--sh);
}
.score-hero .n{font-size:46px;font-weight:700;line-height:1.1;font-variant-numeric:tabular-nums}
.score-hero .d{font-size:14px;color:var(--tx2);margin-top:4px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px;margin-bottom:16px}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px;box-shadow:var(--sh)}
.kpi .l{font-size:12px;color:var(--tx2);margin-bottom:5px}
.kpi .v{font-size:24px;font-weight:600;font-variant-numeric:tabular-nums}
.kpi .s{font-size:12px;color:var(--tx3);margin-top:2px}

.diag{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:14px}
.dcard{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:18px;box-shadow:var(--sh)}
.dcard h3{font-size:14px;font-weight:600;margin-bottom:3px;display:flex;align-items:center;gap:7px}
.dot{width:8px;height:8px;border-radius:50%}
.dcard .sub{font-size:12px;color:var(--tx3);margin-bottom:12px}
.drow{display:flex;align-items:center;gap:10px;padding:7px 0;border-top:1px solid var(--line);font-size:13px}
.drow:first-of-type{border-top:none}
.drow .nm{flex:1}
.drow .bar{width:70px;height:5px;border-radius:3px;background:var(--track);overflow:hidden}
.drow .bar i{display:block;height:100%;border-radius:3px}
.drow .pc{font-size:12px;color:var(--tx2);font-variant-numeric:tabular-nums;min-width:34px;text-align:right}
.empty{color:var(--tx3);font-size:13px;padding:8px 0}

table{width:100%;border-collapse:collapse;font-size:13px}
th{text-align:left;font-weight:500;color:var(--tx2);font-size:12px;padding:8px 10px;border-bottom:1px solid var(--line)}
td{padding:9px 10px;border-bottom:1px solid var(--line)}
tr:last-child td{border-bottom:none}
.rate{font-variant-numeric:tabular-nums;font-weight:500}
.pill{display:inline-block;padding:1px 7px;border-radius:20px;font-size:11px}
.pill.g{background:var(--green-bg);color:var(--green)}
.pill.a{background:var(--amber-bg);color:var(--amber)}
.pill.r{background:var(--red-bg);color:var(--red)}
.pill.y{background:var(--blue-bg);color:var(--blue)}
.pill.n{background:var(--tx3-bg,rgba(127,127,127,.12));color:var(--tx2)}

.rec{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px 18px;margin-bottom:10px}
.rec-h{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:8px}
.rec-h .dt{font-size:12px;color:var(--tx3);margin-left:auto}
.rec .ln{display:flex;gap:16px;font-size:12px;color:var(--tx2);flex-wrap:wrap}
.rec .ln b{color:var(--tx);font-weight:600}

details{margin-top:10px}
summary{font-size:13px;color:var(--blue);cursor:pointer;padding:6px 0}
.ansbox{margin-top:10px;padding:12px 14px;background:var(--hover2);border-radius:8px;font-size:13px;line-height:1.7}
.ansbox .lbl{font-size:12px;color:var(--tx2);margin-bottom:4px}
.ansbox .ok{color:var(--green);font-weight:600}
.ansbox .no{color:var(--red);font-weight:600}

.modal{position:fixed;inset:0;background:rgba(0,0,0,.42);display:none;align-items:center;justify-content:center;z-index:100;padding:20px}
.modal.on{display:flex}
.modal .box{background:var(--card);border-radius:12px;padding:26px;max-width:420px;width:100%}
.modal h3{font-size:16px;font-weight:600;margin-bottom:8px}
.modal p{font-size:14px;color:var(--tx2);line-height:1.7;margin-bottom:18px}
.modal .row{display:flex;gap:8px;justify-content:flex-end}

.empty-state{text-align:center;padding:56px 20px;color:var(--tx3)}
.empty-state h3{font-size:15px;color:var(--tx2);margin-bottom:6px;font-weight:500}
.loading{text-align:center;padding:60px;color:var(--tx3);font-size:14px}

/* ---------- 窄屏适配 ----------
   核心问题：header 是 position:sticky，exam-bar 也 sticky 并靠 top 偏移接在它下面。
   窄屏时 header 里的 nav 会换行、字号换行后整体变高，如果 still 用桌面的 63px，
   exam-bar 就会被 header 盖住（计时器/交卷按钮显示不全）。
   办法：① 该处直接让 header 不再 sticky（手机竖屏本来就不该占两行固定栏），
        ② exam-bar 改为 top:0 独占顶部，③ 用绝对定位的高度变量兜底。
   这样窄屏只有一条固定栏，永远不遮挡。 */
@media (max-width:640px){
  /* 关键：窄屏只允许一条固定栏。
     上一版漏了这句，header 仍是 sticky、和 exam-bar 一起钉在 top:0，
     两者重叠（header z-index 更高）→ 滚动时看着像答题栏"消失"了。 */
  header{position:static;padding:12px 0}
  header .wrap{gap:12px;flex-wrap:wrap}
  h1{font-size:15px}
  .sub{font-size:11px}

  /* 窄屏：header 随页面滚走，只留 exam-bar 固定在顶部 */
  .exam-bar{top:0;padding:10px 0}
  .exam-bar .wrap{gap:10px}
  .timer{font-size:17px;padding:3px 10px}
  .prog{font-size:12px}
  .autosave{font-size:11px}
  .exam-actions{margin-left:auto}

  .wrap{padding:0 14px}
  .card{padding:16px}
  .subj-grid{grid-template-columns:1fr}

  /* 题目导航做成横向滚动条，省纵向空间 */
  .qnav{
    flex-wrap:nowrap;overflow-x:auto;gap:6px;
    padding:12px 0;margin-bottom:16px;
    -webkit-overflow-scrolling:touch;scrollbar-width:none;
  }
  .qnav::-webkit-scrollbar{display:none}
  .qn{flex:0 0 auto}

  .resume-row{gap:10px}
  .resume-txt{min-width:0}
  .resume-act{width:100%;justify-content:flex-end}

  /* 长表格 / 正文横向滚动，避免撑破布局 */
  table{display:block;overflow-x:auto}
}

/* ---------- 双击查词弹层 ---------- */
#word-pop{
  position:fixed;z-index:200;max-width:330px;display:none;
  background:var(--card);border:1px solid var(--line2);border-radius:8px;
  box-shadow:var(--sh-lift);padding:10px 13px;
  font-size:13px;line-height:1.55;user-select:none;cursor:default;
}
#word-pop .wp-word{font-weight:600;font-size:14px;color:var(--blue)}
#word-pop .wp-phone{color:var(--tx3);font-size:12px;margin:1px 0 3px;font-family:Georgia,serif}
#word-pop .wp-trans{color:var(--tx);white-space:pre-line}
#word-pop .wp-miss{color:var(--tx3)}
</style>
</head>
<body>

<header>
  <div class="wrap">
    <div>
      <h1>MBA 模拟考试系统</h1>
      <div class="sub" id="datasrc">2021–2026 真题题库 · 按考点比例抽题</div>
    </div>
    <nav>
      <button data-pg="home" class="on">首页</button>
      <button data-pg="exam" id="nav-exam" style="display:none">答题</button>
      <button data-pg="result" id="nav-result" style="display:none">成绩</button>
      <button data-pg="history">记录</button>
    </nav>
  </div>
</header>

<!-- 首页 -->
<section class="page on" id="pg-home">
  <div class="wrap">
    <!-- 未完成考试：断点续答入口。默认隐藏，检测到上次未交卷的试卷时显示。 -->
    <div class="card resume-card" id="resume-card" style="display:none">
      <div class="resume-row">
        <span class="resume-ico"></span>
        <div class="resume-txt">
          <b id="resume-title">上次考试未完成</b>
          <div class="sub" id="resume-sub"></div>
        </div>
        <div class="resume-act">
          <button class="btn" id="btn-resume">继续答题</button>
          <button class="btn ghost" id="btn-discard">放弃</button>
        </div>
      </div>
    </div>
    <div class="card" style="margin-bottom:16px">
      <h2>选择科目</h2>
      <div class="hint">题量、分值、时长均与真实考试一致。数学题以原版截图呈现，逻辑与英语为可检索文本。</div>
      <div class="subj-grid" id="subj-grid">
        <div class="subj" data-s="zg">
          <h3>管理类联考综合能力</h3>
          <div class="code">科目代码 199 · 满分 200</div>
          <div class="meta">
            <div><b>57</b>题目</div>
            <div><b>180</b>分钟</div>
            <div><b id="pool-zg">—</b>题库</div>
          </div>
          <div class="struct" id="struct-zg"></div>
          <div class="subj-acts">
            <div class="mode-tabs">
              <button class="mt on" data-m="random">随机模式</button>
              <button class="mt" data-m="year">指定年份真题</button>
            </div>
            <div class="year-row">
              <select class="yr-sel" aria-label="选择年份"></select>
              <button class="btn sm ghost" data-yr-start>开始考试</button>
            </div>
            <div class="mode-hint"></div>
          </div>
        </div>
        <div class="subj" data-s="en">
          <h3>英语（二）</h3>
          <div class="code">科目代码 204 · 满分 100</div>
          <div class="meta">
            <div><b>45</b>题目</div>
            <div><b>180</b>分钟</div>
            <div><b id="pool-en">—</b>题库</div>
          </div>
          <div class="struct" id="struct-en"></div>
          <div class="subj-acts">
            <div class="mode-tabs">
              <button class="mt on" data-m="random">随机模式</button>
              <button class="mt" data-m="year">指定年份真题</button>
            </div>
            <div class="year-row">
              <select class="yr-sel" aria-label="选择年份"></select>
              <button class="btn sm ghost" data-yr-start>开始考试</button>
            </div>
            <div class="mode-hint"></div>
          </div>
        </div>
      </div>
    </div>
    <div class="card">
      <h2>抽题规则</h2>
      <div class="hint">依据 2026 官方大纲与近三年真题实测题量分布</div>
      <div id="rules" style="font-size:13px;color:var(--tx2);line-height:1.9"></div>
    </div>
  </div>
</section>

<!-- 答题页 -->
<section class="page" id="pg-exam">
  <div class="exam-bar">
    <div class="wrap">
      <span class="timer" id="timer">--:--</span>
      <span class="prog" id="prog"></span>
      <span class="autosave" id="autosave" title="答题进度会自动保存在本机，刷新或关闭页面后可继续">
        <span class="ico"></span><span id="autosave-txt">已自动保存</span>
      </span>
      <div class="exam-actions">
        <button class="btn ghost sm" id="btn-pause">暂停</button>
        <button class="btn sm" id="btn-submit">交卷</button>
      </div>
    </div>
  </div>
  <div class="wrap">
    <div class="qnav" id="qnav"></div>
    <div id="qlist"></div>
  </div>
</section>

<!-- 成绩页 -->
<section class="page" id="pg-result">
  <div class="wrap" id="result-body"></div>
</section>

<!-- 记录页 -->
<section class="page" id="pg-history">
  <div class="wrap">
    <div class="card">
      <div style="display:flex;align-items:center;margin-bottom:4px">
        <h2>考核记录</h2>
        <button class="btn ghost sm" id="btn-clear" style="margin-left:auto">清空全部</button>
      </div>
      <div class="hint">每次考核的日期、科目、得分、用时与知识点表现</div>
      <div id="hist-list"></div>
    </div>
  </div>
</section>

<div class="modal" id="modal">
  <div class="box">
    <h3 id="m-title">确认</h3>
    <p id="m-text"></p>
    <div class="row">
      <button class="btn ghost" id="m-cancel">取消</button>
      <button class="btn" id="m-ok">确定</button>
    </div>
  </div>
</div>

<!-- 内置题库。没有这两个文件时自动回退到 fetch（开发态） -->
<script src="data/payload.enc.js"></script>
<script src="secure.js"></script>
<script src="guard.js"></script>
<script src="engine.js"></script>
<script src="app.js"></script>
<script>
// 数据源体检：把加载状态显示在首页底部，避免静默降级带来的困惑。
// 只读 window.__DATASRC__（由 app.js 在启动后写入），不跨脚本引用变量。
// 加密版启动时要先解密 payload.enc.js（异步），boot 完成才发 'bootdone'；
// 不能直接在 load 里读——那会儿解密通常还没结束，会误报"加载失败"。
window.addEventListener('load', () => {
  const tag = document.getElementById('datasrc');
  if (!tag) return;
  const show = () => {
    const s = window.__DATASRC__;
    if (!s) { tag.textContent = '数据源未就绪：题库加载失败'; return; }
    const how = s.inline ? '内置题库（离线可用）'
                         : 'data/question_bank.json（需本地服务）';
    tag.textContent = `${s.count} 题 · ${how}`;
  };
  if (window.__BOOT_DONE__) show();
  else window.addEventListener('bootdone', show);
});
</script>
</body>
</html>
