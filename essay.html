<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>英语作文背诵助手</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; }
  body {
    font-family: "Segoe UI", "Microsoft YaHei", -apple-system, sans-serif;
    background: #f4f6fa; color: #1e293b;
    display: flex; flex-direction: column; overflow: hidden;
    padding-bottom: env(safe-area-inset-bottom);
  }
  header {
    background: #1d4ed8; color: #fff; padding: 10px 16px;
    display: flex; align-items: center; justify-content: space-between; flex-shrink: 0;
    gap: 8px;
  }
  header h1 { font-size: 17px; font-weight: 600; white-space: nowrap; }
  header .hdr-actions { display: flex; gap: 6px; flex-shrink: 0; }
  .layout { display: flex; flex: 1; overflow: hidden; }

  /* ---------- 侧栏（作文库） ---------- */
  .sidebar {
    width: 290px; background: #fff; border-right: 1px solid #e2e8f0;
    display: flex; flex-direction: column; flex-shrink: 0; overflow: hidden;
  }
  .side-head {
    padding: 14px 16px 8px; display: flex; justify-content: space-between; align-items: center;
    flex-shrink: 0;
  }
  .side-head b { font-size: 15px; color: #475569; }
  .essay-list { flex: 1; overflow-y: auto; padding: 4px 10px 16px; }
  .essay-item {
    padding: 12px 14px; border-radius: 12px; cursor: pointer; margin-bottom: 8px;
    border: 1px solid transparent; transition: background .15s;
  }
  .essay-item:hover { background: #f1f5f9; }
  .essay-item.active { background: #eff6ff; border-color: #bfdbfe; }
  .essay-item .t { font-size: 15px; font-weight: 600; margin-bottom: 5px; line-height: 1.4; }
  .essay-item .m { font-size: 12px; color: #94a3b8; display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  .badge-due { background: #fee2e2; color: #dc2626; font-size: 11px;
    padding: 1px 7px; border-radius: 99px; font-weight: 600; }
  .stars { color: #f59e0b; letter-spacing: 1px; }

  /* ---------- 主区 ---------- */
  main { flex: 1; overflow-y: auto; -webkit-overflow-scrolling: touch; padding: 18px 26px 40px; }
  .top-bar { display: flex; align-items: center; gap: 10px; margin-bottom: 14px; }
  .top-bar h2 { font-size: 19px; flex: 1; line-height: 1.4; }
  .tab-switch { display: flex; background: #e2e8f0; border-radius: 9px; padding: 3px; flex-shrink: 0; }
  .tab-switch button {
    border: none; background: transparent; padding: 6px 16px; border-radius: 7px;
    font-size: 13px; cursor: pointer; color: #475569;
  }
  .tab-switch button.on { background: #fff; color: #1d4ed8; font-weight: 600;
    box-shadow: 0 1px 3px rgba(0,0,0,.12); }

  button.btn {
    border: 1px solid #cbd5e1; background: #fff; color: #334155;
    padding: 8px 16px; border-radius: 9px; font-size: 14px; cursor: pointer;
    transition: all .15s; touch-action: manipulation;
  }
  button.btn:active { transform: scale(.96); }
  button.btn.primary { background: #1d4ed8; border-color: #1d4ed8; color: #fff; }
  button.btn.danger { color: #dc2626; }
  button.btn.playing { background: #dcfce7; border-color: #16a34a; color: #15803d; font-weight: 600; }
  .back-btn { display: none; }

  .panel {
    background: #fff; border: 1px solid #e2e8f0; border-radius: 14px;
    padding: 16px 18px; margin-bottom: 14px;
  }
  .panel h3 { font-size: 13px; color: #1d4ed8; margin-bottom: 12px; letter-spacing: .5px; }
  .tts-row { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
  .tts-row label { font-size: 13px; color: #64748b; display: flex; align-items: center; gap: 6px; }
  select, input[type="range"] { accent-color: #1d4ed8; }
  select {
    border: 1px solid #cbd5e1; border-radius: 8px; padding: 7px 8px; font-size: 14px;
    background: #fff; max-width: 100%;
  }
  .rate-val { font-size: 13px; color: #1d4ed8; font-weight: 600; width: 38px; }
  .repeat-group { display: flex; gap: 4px; }
  .repeat-group button {
    border: 1px solid #cbd5e1; background: #fff; padding: 6px 13px;
    border-radius: 7px; font-size: 14px; cursor: pointer; color: #475569; touch-action: manipulation;
  }
  .repeat-group button.on { background: #1d4ed8; color: #fff; border-color: #1d4ed8; }
  .tts-status { font-size: 12px; color: #94a3b8; margin-top: 10px; min-height: 16px; }

  .hide-row { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
  .hide-row input[type="range"] { width: 170px; }
  .ratio-val { font-size: 13px; color: #1d4ed8; font-weight: 600; width: 44px; }
  .hide-stats { font-size: 12px; color: #94a3b8; }

  /* ---------- 正文 ---------- */
  .essay-text {
    background: #fff; border: 1px solid #e2e8f0; border-radius: 14px;
    padding: 24px 26px; font-size: 16.5px; line-height: 2.15;
    word-break: normal; overflow-wrap: break-word;
  }
  .essay-text p { margin-bottom: 1em; }
  .essay-text .w {
    cursor: pointer; border-radius: 4px; padding: 0 1px; transition: background .1s;
  }
  .essay-text .w:hover { background: #f1f5f9; }
  .essay-text .w.hidden {
    background: #e8edf6; color: #64748b; font-family: Consolas, monospace;
    font-size: 14.5px;
  }
  .essay-text .w.revealed { background: #fef9c3; }
  .essay-text .w.sent-active { background: #fff3bf; border-radius: 4px; }
  .review-row {
    display: flex; align-items: center; gap: 10px; margin-top: 16px; flex-wrap: wrap;
    font-size: 13px; color: #64748b;
  }

  .edit-form { display: flex; flex-direction: column; gap: 12px; }
  .edit-form input[type="text"] {
    border: 1px solid #cbd5e1; border-radius: 10px; padding: 12px 14px; font-size: 15px; width: 100%;
  }
  .edit-form textarea {
    border: 1px solid #cbd5e1; border-radius: 10px; padding: 14px; font-size: 15px;
    line-height: 1.8; min-height: 340px; resize: vertical; font-family: inherit; width: 100%;
  }
  .edit-form input:focus, .edit-form textarea:focus { outline: none; border-color: #1d4ed8; }
  .edit-actions { display: flex; gap: 10px; }
  .empty-tip { color: #94a3b8; text-align: center; padding: 60px 0; font-size: 14px; }

  /* ================= 手机适配 ================= */
  @media (max-width: 760px) {
    header { padding: 10px 12px; }
    header h1 { font-size: 15px; }
    .hdr-actions .btn { padding: 5px 9px; font-size: 12px; border-radius: 7px; }
    /* 手机上：作文库和背诵页互斥显示 */
    .sidebar { width: 100%; border-right: none; }
    body.in-essay .sidebar { display: none; }
    body:not(.in-essay) main { display: none; }
    main { padding: 12px 14px 32px; }
    .back-btn { display: inline-block; padding: 6px 13px; }
    .top-bar h2 { font-size: 17px; }
    .essay-text { padding: 18px 16px; font-size: 17px; line-height: 2.25; }
    .essay-text .w.hidden { font-size: 15px; }
    .panel { padding: 13px 14px; border-radius: 12px; }
    .tts-row { gap: 10px; }
    .tts-row select { max-width: 46vw; }
    .edit-form textarea { min-height: 50vh; }
  }
</style>
</head>
<body>

<script>
/* 站点账号层守卫（发布为 essay.html 时生效）。
   本地 file:// 打开时跳过登录；线上未登录 → 跳 login.html 并带 next 回跳。
   与根目录 auth.js 同一套会话键（mba_auth）——改动需两处同步。 */
(function () {
  if (location.protocol === 'file:') { window.__ACCT__ = 'local'; return; }
  var s = null;
  try { s = JSON.parse(localStorage.getItem('mba_auth') || 'null'); } catch (e) {}
  if (s && s.u) { window.__ACCT__ = s.u; return; }
  location.replace('login.html?next=' + encodeURIComponent('essay.html'));
})();
</script>

<header>
  <h1>📝 英语作文背诵助手</h1>
  <div class="hdr-actions">
    <button class="btn" style="background:transparent;color:#fff;border-color:rgba(255,255,255,.45)" onclick="exportData()">导出</button>
    <button class="btn" style="background:transparent;color:#fff;border-color:rgba(255,255,255,.45)" onclick="document.getElementById('importJson').click()">导入</button>
    <button class="btn" style="background:transparent;color:#fff;border-color:rgba(255,255,255,.45)" onclick="document.getElementById('importTxt').click()">TXT</button>
    <input type="file" id="importJson" accept=".json" style="display:none" onchange="importJsonFile(this)">
    <input type="file" id="importTxt" accept=".txt" style="display:none" onchange="importTxtFile(this)">
  </div>
</header>

<div class="layout">
  <aside class="sidebar">
    <div class="side-head">
      <b>我的作文库</b>
      <button class="btn primary" style="padding:6px 14px" onclick="newEssay()">＋ 新建</button>
    </div>
    <div class="essay-list" id="essayList"></div>
  </aside>

  <main id="mainArea"></main>
</div>

<script>
/* ================= 数据层 ================= */
/* 数据键按账号隔离（__ACCT__ 由上方守卫脚本设置；file:// 下为 local）。
   旧版无后缀数据在 load() 里一次性迁移。 */
const LS_KEY = 'essay_memo_v2:' + (window.__ACCT__ || 'local');
if (!window.__ACCT__ && location.protocol !== 'file:') {
  // 未登录且守卫已发起跳转：终止本脚本，避免渲染半屏后跳走
  throw new Error('redirecting to login');
}

function defaultEssays() {
  return [
    {
      id: 'demo1', title: '示范：图表作文模板（英语二大作文）',
      createdAt: Date.now(),
      lastReview: null, level: 0,
      text: `The chart above clearly illustrates the number of postgraduate applicants in China between 2020 and 2025. As is prominently shown, the figure witnessed a steady increase from 3 million in 2020 to 5 million in 2025, nearly doubling within five years.

Several factors can account for this trend. First and foremost, with the increasingly fierce competition in the job market, a growing number of college graduates choose to pursue further education to enhance their competitiveness. In addition, the expansion of graduate programs in universities has made this option more accessible than ever before. Last but not least, society's rising demand for highly qualified talents also plays an indispensable role.

Taking all these factors into consideration, we may safely arrive at the conclusion that this tendency will continue in the foreseeable future.`
    },
    {
      id: 'demo2', title: '示范：建议信模板（小作文）',
      createdAt: Date.now(),
      lastReview: null, level: 0,
      text: `Dear Sir or Madam,

I am writing to express my sincere gratitude for the excellent services you have provided, and to offer a few suggestions that I believe may further improve them.

First of all, it would be highly appreciated if more detailed information could be available on your official website, which would save visitors a great deal of time. Furthermore, I would suggest that the opening hours be extended on weekends, since most readers are only free at that time. Finally, additional self-service facilities might be introduced to reduce the waiting time.

Thank you for your time and attention. I am looking forward to your reply at your earliest convenience.

Yours sincerely,
Li Ming`
    }
  ];
}

let essays = load();
let currentId = essays.length ? essays[0].id : null;
let viewMode = 'study';

function load() {
  try {
    const v2 = JSON.parse(localStorage.getItem(LS_KEY));
    if (Array.isArray(v2) && v2.length) return v2;
    const legacy = JSON.parse(localStorage.getItem('essay_memo_v2'));   // 无账号时代的数据，迁移一次
    if (Array.isArray(legacy) && legacy.length) { localStorage.setItem(LS_KEY, JSON.stringify(legacy)); return legacy; }
    const v1 = JSON.parse(localStorage.getItem('essay_memo_v1'));
    if (Array.isArray(v1) && v1.length) { localStorage.setItem(LS_KEY, JSON.stringify(v1)); return v1; }
  } catch (e) {}
  return defaultEssays();
}
function save() { localStorage.setItem(LS_KEY, JSON.stringify(essays)); }
function cur() { return essays.find(e => e.id === currentId) || null; }

const INTERVALS = [0, 1, 2, 4, 7, 15, 30];
function isDue(e) {
  if (!e.lastReview) return true;
  const lv = Math.min(e.level || 0, INTERVALS.length - 1);
  return (Date.now() - e.lastReview) / 86400000 >= INTERVALS[lv];
}

/* ================= 分词 / 分句 ================= */
function tokenize(text) { return text.match(/\S+|\s+/g) || []; }
function isWordTok(tok) { return /[A-Za-z]/.test(tok); }
function wordText(tok) { return tok.replace(/^[^A-Za-z]+|[^A-Za-z']+$/g, '') || tok; }

function buildSentences(tokens) {
  const sents = [];
  let idxs = [], buf = '';
  tokens.forEach((tok, i) => {
    if (!isWordTok(tok)) { buf += tok; return; }
    idxs.push(i); buf += tok;
    if (/[.!?]["')\]]?$/.test(tok.trim())) {
      sents.push({ idxs: idxs.slice(), text: buf.trim() });
      idxs = []; buf = '';
    }
  });
  if (idxs.length) sents.push({ idxs, text: buf.trim() });
  return sents.filter(s => /[A-Za-z]/.test(s.text));
}

/* ================= 作文库列表 ================= */
function renderList() {
  const box = document.getElementById('essayList');
  box.innerHTML = '';
  if (!essays.length) {
    box.innerHTML = '<div class="empty-tip">还没有作文<br>点上方「＋ 新建」或导入 TXT</div>';
    return;
  }
  essays.forEach(e => {
    const div = document.createElement('div');
    div.className = 'essay-item' + (e.id === currentId && document.body.classList.contains('in-essay') ? ' active' : '');
    const words = tokenize(e.text).filter(isWordTok).length;
    const stars = '★'.repeat(e.level || 0) + '☆'.repeat(5 - (e.level || 0));
    div.innerHTML = `<div class="t"></div>
      <div class="m"><span class="stars">${stars}</span><span>${words}词</span>
      ${isDue(e) ? '<span class="badge-due">待复习</span>' : ''}</div>`;
    div.querySelector('.t').textContent = e.title || '未命名';
    div.onclick = () => { currentId = e.id; viewMode = 'study'; resetHide(); stopTTS(); openEssay(); };
    box.appendChild(div);
  });
}
function openEssay() { document.body.classList.add('in-essay'); render(); }
function backToList() { stopTTS(); document.body.classList.remove('in-essay'); renderList(); }

/* ================= 学习页 ================= */
let hideRatio = 0, hiddenSet = new Set(), showHint = true, activeSent = -1;
function resetHide() { hideRatio = 0; hiddenSet = new Set(); activeSent = -1; }

function renderStudy() {
  const e = cur();
  const main = document.getElementById('mainArea');
  if (!e) { main.innerHTML = '<div class="empty-tip">先从作文库选一篇</div>'; return; }
  main.innerHTML = `
    <div class="top-bar">
      <button class="btn back-btn" onclick="backToList()">← 库</button>
      <h2>${esc(e.title || '未命名')}</h2>
      <div class="tab-switch">
        <button class="${viewMode === 'study' ? 'on' : ''}" onclick="switchTab('study')">背诵</button>
        <button class="${viewMode === 'edit' ? 'on' : ''}" onclick="switchTab('edit')">编辑</button>
      </div>
    </div>

    <div class="panel">
      <h3>🔊 领读 · 反复播放</h3>
      <div class="tts-row">
        <button class="btn primary" id="playBtn" onclick="togglePlay()">▶ 播放</button>
        <button class="btn" onclick="stopTTS()">⏹</button>
        <label>模式
          <select id="ttsMode">
            <option value="sent">逐句跟读</option>
            <option value="whole">整篇连读</option>
          </select>
        </label>
        <label>重复
          <span class="repeat-group" id="repeatGroup">
            <button data-n="1">1</button><button data-n="2" class="on">2</button>
            <button data-n="3">3</button><button data-n="5">5</button>
          </span>
        </label>
      </div>
      <div class="tts-row" style="margin-top:10px">
        <label>发音人
          <select id="voiceSel"></select>
        </label>
        <label>语速 <input type="range" id="rateSlider" min="0.4" max="1.2" step="0.05" value="0.85">
          <span class="rate-val" id="rateVal">0.85</span></label>
      </div>
      <div class="tts-status" id="ttsStatus"></div>
    </div>

    <div class="panel">
      <h3>🙈 遮词背诵</h3>
      <div class="hide-row">
        <button class="btn" onclick="hideMore(-10)">−10%</button>
        <button class="btn primary" onclick="hideMore(10)">遮盖 +10%</button>
        <input type="range" id="hideSlider" min="0" max="100" step="10" value="${hideRatio}"
          onchange="applyHide(+this.value)">
        <span class="ratio-val" id="ratioVal">${hideRatio}%</span>
        <label style="font-size:13px;color:#64748b"><input type="checkbox" id="hintChk" ${showHint ? 'checked' : ''}
          onchange="showHint=this.checked;renderText()"> 首字母提示</label>
        <span class="hide-stats" id="hideStats"></span>
      </div>
    </div>

    <div class="essay-text" id="essayText"></div>

    <div class="review-row">
      背完标记一下记忆情况：
      <button class="btn danger" onclick="review(-1)">没记住</button>
      <button class="btn" onclick="review(0)">有点难</button>
      <button class="btn primary" onclick="review(1)">记住了</button>
    </div>
  `;

  document.getElementById('rateSlider').addEventListener('input', ev => {
    document.getElementById('rateVal').textContent = (+ev.target.value).toFixed(2);
  });
  document.getElementById('repeatGroup').addEventListener('click', ev => {
    const b = ev.target.closest('button'); if (!b) return;
    ttsRepeats = +b.dataset.n;
    document.querySelectorAll('#repeatGroup button').forEach(x => x.classList.toggle('on', x === b));
  });
  renderVoices();
  renderText();
  if (ttsPlaying) markPlayBtn(true);
}

/* ---------- 正文渲染（段落/换行正确呈现） ---------- */
function renderText() {
  const e = cur(); if (!e) return;
  const toks = tokenize(e.text);
  const box = document.getElementById('essayText');
  box.innerHTML = '';
  const sents = sentences();

  toks.forEach((tok, i) => {
    if (!isWordTok(tok)) {
      // 空白 token：还原段落与换行
      if (/\n\s*\n/.test(tok)) { box.appendChild(document.createElement('p')); }
      else if (/\n/.test(tok)) { box.appendChild(document.createElement('br')); }
      else { box.appendChild(document.createTextNode(' ')); }
      return;
    }
    const sp = document.createElement('span');
    sp.className = 'w';
    sp.dataset.wi = i;
    if (hiddenSet.has(i)) {
      sp.classList.add('hidden');
      const wt = wordText(tok);
      const pre = tok.slice(0, tok.indexOf(wt));
      const post = tok.slice(tok.indexOf(wt) + wt.length);
      const shown = showHint && wt.length
        ? wt[0] + '·'.repeat(Math.max(wt.length - 1, 1))
        : '·'.repeat(Math.max(wt.length, 3));
      sp.textContent = pre + shown + post;
    } else {
      sp.textContent = tok;
      if (activeSent >= 0 && sents[activeSent] && sents[activeSent].idxs.includes(i)) {
        sp.classList.add('sent-active');
      }
    }
    sp.onclick = () => {
      if (hiddenSet.has(i)) {
        hiddenSet.delete(i);
        sp.classList.remove('hidden');
        sp.textContent = tok;
        sp.classList.add('revealed');
      } else { hiddenSet.add(i); renderText(); }
      updateHideStats();
    };
    box.appendChild(sp);
  });
  updateHideStats();
}

let sentencesCache = null;
function sentences() {
  const e = cur();
  if (!sentencesCache || sentencesCache.id !== e.id || sentencesCache.text !== e.text) {
    sentencesCache = { id: e.id, text: e.text, list: buildSentences(tokenize(e.text)) };
  }
  return sentencesCache.list;
}

function applyHide(ratio) {
  hideRatio = Math.max(0, Math.min(100, ratio));
  const e = cur(); const toks = tokenize(e.text);
  const words = toks.map((t, i) => isWordTok(t) ? i : -1).filter(i => i >= 0);
  const shuffled = words.slice().sort(() => Math.random() - 0.5);
  hiddenSet = new Set(shuffled.slice(0, Math.round(words.length * hideRatio / 100)));
  const slider = document.getElementById('hideSlider');
  if (slider) slider.value = hideRatio;
  const rv = document.getElementById('ratioVal');
  if (rv) rv.textContent = hideRatio + '%';
  renderText();
}
function hideMore(delta) { applyHide(hideRatio + delta); }
function updateHideStats() {
  const el = document.getElementById('hideStats'); if (!el) return;
  const e = cur(); if (!e) return;
  const total = tokenize(e.text).filter(isWordTok).length;
  el.textContent = `已遮 ${hiddenSet.size}/${total}`;
}

function review(delta) {
  const e = cur(); if (!e) return;
  e.level = Math.max(0, Math.min(5, (e.level || 0) + delta));
  e.lastReview = Date.now();
  save(); renderList();
  alert(delta > 0 ? '👍 记住了！' + INTERVALS[e.level] + ' 天后再来复习这篇'
                  : '📌 已标记，这篇明天会出现在待复习里');
}

/* ================= TTS：Edge 神经网络在线发音 + 本地兜底 ================= */
const TRUSTED_TOKEN = '6A5AA1D4EAFF4E9FB37E23D68491D6F4';
const GEC_VERSION = '2-143.0.3650.75';

/* ---- Sec-MS-GEC v2 签名（移植自 edge-tts 7.3.1 drm.py，已与官方实现逐字节比对一致） ---- */

const GEC_K14 = 0xC9DC06A7;
const GEC_KB = GEC_K.slice(); GEC_KB[14] = GEC_K14;
const GEC_IV = [0x6A09E667,0xBB67AE85,0x3C6EF372,0xA54FF53A,0x510E527F,0x9B05688C,0x1F83D9AB,0x5BE0CD19];
const GEC_ST = [0xFD9FBEA2,0x91243CE7,0xBE499094,0xCD2E1E0A,0x6C006F49,0x04BD35AB,0xFEB0A7E4,0x03EFFBD2];
const GEC_SCH = [0xEB24BF9E,0x1558691F,0xA0C09EE2,0x0CFA32BA,0xA622EE8C,0xD1DD9491,0xC0DD25A0,0xF9E70AB6,0xF0C31573,0x7058CE4E,0x7188E606,0x00E5AB33,0xD258B060,0x72766564];
const GEC_COEF = [[0xE82E91B1,0xB32700D0],[0x44DE24C6,0x88DFF51D],[0x3BEB65BC,0x29514038],[0xC89C5933,0xB328CBDF],[0x8D1EC211,0xD405B4D5],[0x314EF5D5,0x26E55F3C],[0xE92491B1,0x607801C6],[0xF0A5B9D5,0x82B2C1FB],[0x06064CF3,0xFA51A3DA],[0xDA79FA60,0x207CC464],[0xBED20560,0x3C3C74F3],[0x89F9C9F8,0xD2D14B61],[0x35FA38C6,0xBB04A2C1],[0xCB49E3C6,0xC5626167]];
const gecRol16 = v => ((v << 16) | (v >>> 16)) >>> 0;
const gecS0 = v => (((v >>> 7) | (v << 25)) ^ ((v >>> 18) | (v << 14)) ^ (v >>> 3)) >>> 0;
const gecS1 = v => (((v >>> 17) | (v << 15)) ^ ((v >>> 19) | (v << 13)) ^ (v >>> 10)) >>> 0;
function gecRounds(st, ws, first) {
  let [a,b,c,d,e,f,g,h] = st;
  const K = first === 14 ? GEC_KB : GEC_K;
  for (let i = first; i < 64; i++) {
    const S1 = (((e>>>6)|(e<<26)) ^ ((e>>>11)|(e<<21)) ^ ((e>>>25)|(e<<7))) >>> 0;
    const t1 = (h + S1 + (g ^ (e & (f ^ g))) + K[i] + ws[i]) >>> 0;
    const S0 = (((a>>>2)|(a<<30)) ^ ((a>>>13)|(a<<19)) ^ ((a>>>22)|(a<<10))) >>> 0;
    const t2 = (S0 + ((a & b) | (c & (a | b)))) >>> 0;
    h=g; g=f; f=e; e=(d+t1)>>>0; d=c; c=b; b=a; a=(t1+t2)>>>0;
  }

function gecExpand(ws, from) {
  for (let i = from; i < 64; i++) ws[i] = (gecS1(ws[i-2]) + ws[i-7] + gecS0(ws[i-15]) + ws[i-16]) >>> 0;
}
function gecMsSha256(data) {
  const L = 57 + data.length;
  const padded = [...data.slice(7), 0x80, ...new Array((((55 - L) % 64) + 64) % 64).fill(0)];
  const bits = L * 8;
  for (let i = 7; i >= 0; i--) padded.push(Math.floor(bits / 2 ** (8 * i)) & 0xFF);
  // init：虚拟首块（56 个零字节 + 前 7 字节 + 1 个零字节）的修正状态
  const ws = new Array(64).fill(0);
  ws[14] = (data[0]<<16 | data[1]<<8 | data[2]) >>> 0;
  ws[15] = (data[3]<<24 | data[4]<<16 | data[5]<<8 | data[6]) >>> 0;
  for (let ix = 16; ix <= 29; ix++) {
    let v = GEC_SCH[ix-16];
    if (ix-2 >= 14)  v = (v + (ix===16 ? (gecS1(ws[ix-2]) ^ 0x000B92C0) : gecS1(ws[ix-2]))) >>> 0;
    if (ix-7 >= 14)  v = (v + ws[ix-7]) >>> 0;
    if (ix-15 >= 14) v = (v + (ix===29 ? (gecS0(ws[ix-15]) ^ 0x059C0B80) : gecS0(ws[ix-15]))) >>> 0;
    ws[ix] = v >>> 0;
  }
  ws[30] = (gecS1(ws[28]) + ws[23] + gecS0(ws[15]) + ws[14] + GEC_K14 - GEC_K[14]) >>> 0;
  gecExpand(ws, 31);
  let state = gecRounds(GEC_ST, ws, 14).map((w,i) => (w + GEC_IV[i]) >>> 0);
  for (let off = 0; off < padded.length; off += 64) {
    const bw = [];
    for (let j = 0; j < 16; j++) bw.push((padded[off+j*4]<<24 | padded[off+j*4+1]<<16 | padded[off+j*4+2]<<8 | padded[off+j*4+3]) >>> 0);
    gecExpand(bw, 16);
    const wk = gecRounds(state, bw, 0);
    state = state.map((s,i) => (s + wk[i]) >>> 0);
  }
  const out = [];
  state.forEach(w => out.push((w>>>24)&0xFF,(w>>>16)&0xFF,(w>>>8)&0xFF,w&0xFF));
  return Uint8Array.from(out);
}
function gecCs64(data, dg) {
  const dv = new DataView(dg.buffer);
  const kA = (dv.getUint32(0, true) | 1) >>> 0, kB = (dv.getUint32(4, true) | 1) >>> 0;
  const fA = Math.imul(kA, 0x82893933) >>> 0, fB = Math.imul(kB, 0x82893933) >>> 0;
  const terms = GEC_COEF.map(([cf], i) => Math.imul(cf, i%2 ? fB : fA) >>> 0);
  const offs = GEC_COEF.map(([,of]) => of);
  const raw = [0, ...data];
  for (let i = 0; i < (4 - raw.length % 4) % 4; i++) raw.push(0);
  const rdv = new DataView(Uint8Array.from(raw).buffer);
  const ws = [];
  for (let i = 0; i < raw.length / 4; i++) ws.push(rdv.getUint32(i*4, true));
  if (ws.length % 2) ws.push(0);
  for (let ix = 0; ix < ws.length; ix++) {
    let t = Math.imul(ws[ix], ix%2 ? kB : kA) >>> 0;
    let o = Math.imul(gecRol16(ws[ix]), ix%2 ? 0xC31713DB : 0xEF0569FB) >>> 0;
    if (ix === 0) { t = (t + Math.imul(0xF2F90B1A, fA)) >>> 0; o = (o + 0x0B1A0000) >>> 0; }
    terms.push(t); offs.push(o);
  }
  let sAcc = 0, sLast = 0, st = 0, acc = 0;
  for (let ix = 0; ix < terms.length; ix += 2) {
    const x = terms[ix], y = terms[ix+1];
    let t = gecRol16((offs[ix] + x) >>> 0);
    let q = Math.imul(t, 0x76F50F34) >>> 0;
    sAcc = (sAcc + Math.imul(gecRol16(q), 0xC3EFEA97) + q) >>> 0;
    t = gecRol16((offs[ix+1] + y) >>> 0);
    q = Math.imul(t, 0x1881CE3C) >>> 0;
    sLast = (Math.imul(gecRol16(q), 0x35BD1EC9) + q) >>> 0;
    sAcc = (sAcc + sLast) >>> 0;
    st = (Math.imul(st, kA) + x) >>> 0;
    st = Math.imul(gecRol16(st), 0xCF98B111) >>> 0;
    st = Math.imul(gecRol16(st), 0x87085B9F) >>> 0;
    st = Math.imul(gecRol16(st), 0x12CEB96D) >>> 0;
    st = Math.imul(gecRol16(st), 0x257E1D83) >>> 0;
    acc = (acc + st) >>> 0;
    let t2 = (Math.imul(st, kB) + y) >>> 0;
    t2 = Math.imul(gecRol16(t2), 0xA27416F5) >>> 0;
    t2 = Math.imul(gecRol16(t2), 0xD38396FF) >>> 0;
    st = Math.imul(gecRol16(Math.imul(gecRol16(t2), 0x7C932B89) >>> 0), 0xBFA49F69) >>> 0;

function genGec() {
  let n = Math.floor(Date.now() / 1000) + 11644473600;
  n = n - (n % 300);
  const str = (BigInt(n) * 10000000n).toString() + TRUSTED_TOKEN;
  const data = Uint8Array.from([...str].map(c => c.charCodeAt(0)));
  const dg = gecMsSha256(data);
  const [w0, w1] = gecCs64(data, dg);
  const hex = w => [w&0xFF,(w>>>8)&0xFF,(w>>>16)&0xFF,(w>>>24)&0xFF].map(b => b.toString(16).padStart(2,'0')).join('');
  return (hex(w0) + hex(w1) + [...dg].map(b => b.toString(16).padStart(2,'0')).join('')).toUpperCase()
    .replace(/^(.{16})(.*)$/, '$1-$2');
}
const VOICES = [
  { id: 'en-US-AvaMultilingualNeural',    name: 'Ava · 美音自然女声（推荐）' },
  { id: 'en-US-AndrewMultilingualNeural', name: 'Andrew · 美音自然男声' },
  { id: 'en-US-EmmaMultilingualNeural',   name: 'Emma · 美音自然女声 B' },
  { id: 'en-US-BrianMultilingualNeural',  name: 'Brian · 美音自然男声 B' },
  { id: 'en-US-AriaNeural',               name: 'Aria · 美音女声' },
  { id: 'en-US-GuyNeural',                name: 'Guy · 美音男声' },
  { id: 'en-GB-SoniaNeural',              name: 'Sonia · 英音女声' },
  { id: 'en-GB-RyanNeural',               name: 'Ryan · 英音男声' },
  { id: '__local__',                      name: '系统本地发音（离线/较机械）' },
];
const audioCache = new Map(); // voice|rate|text -> blobURL

let ttsPlaying = false, ttsRepeats = 2;
let edgeWs = null, edgeAudio = null, edgeAbort = false;
let localVoices = [];
let useLocalFallback = false;

function xmlEsc(s) {
  return s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
          .replace(/"/g, '&quot;').replace(/'/g, '&apos;');
}
function edgeDateStr() {
  const d = new Date();
  const days = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
  const mon = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  const p = n => String(n).padStart(2, '0');
  return `${days[d.getUTCDay()]} ${mon[d.getUTCMonth()]} ${p(d.getUTCDate())} ${d.getUTCFullYear()} ${p(d.getUTCHours())}:${p(d.getUTCMinutes())}:${p(d.getUTCSeconds())} GMT+0000 (Coordinated Universal Time)`;
}

function curVoice() {
  const sel = document.getElementById('voiceSel');
  const v = VOICES.find(x => x.id === (sel ? sel.value : '')) || VOICES[0];
  return useLocalFallback ? VOICES[VOICES.length - 1] : v;
}
function curRate() { const r = document.getElementById('rateSlider'); return r ? +r.value : 0.85; }

/* --- 在线合成：返回 mp3 blob URL --- */
function edgeSynth(text, voiceId, ratePct) {
  return new Promise(async (resolve, reject) => {
    let settled = false;
    const done = (fn, arg) => { if (!settled) { settled = true; clearTimeout(tmo); try { ws && ws.close(); } catch(e){} fn(arg); } };
    const tmo = setTimeout(() => done(reject, new Error('timeout')), 20000);
    let ws;
    try {
      const gec = await genGec();
      const reqId = (crypto.randomUUID ? crypto.randomUUID() : 'r' + Math.random()).replace(/-/g, '');
      ws = new WebSocket(
        `wss://speech.platform.bing.com/consumer/speech/synthesize/readaloud/edge/v1` +
        `?TrustedClientToken=${TRUSTED_TOKEN}&ConnectionId=${reqId}&Sec-MS-GEC=${gec}&Sec-MS-GEC-Version=${GEC_VERSION}`);
      edgeWs = ws;
      ws.binaryType = 'arraybuffer';
      const chunks = [];
      ws.onopen = () => {
        const ts = edgeDateStr();
        ws.send(`X-Timestamp:${ts}\r\nContent-Type:application/json; charset=utf-8\r\nPath:speech.config\r\n\r\n` +
          JSON.stringify({ context: { synthesis: { audio: {
            metadataoptions: { sentenceBoundaryEnabled: 'false', wordBoundaryEnabled: 'false' },
            outputFormat: 'audio-24khz-48kbitrate-mono-mp3' } } } }) + '\r\n');
        const ssml = `<speak version='1.0' xmlns='http://www.w3.org/2001/10/synthesis' xml:lang='en-US'>` +
          `<voice name='${voiceId}'><prosody pitch='+0Hz' rate='${ratePct}' volume='+0%'>${xmlEsc(text)}</prosody></voice></speak>`;
        ws.send(`X-RequestId:${reqId}\r\nContent-Type:application/ssml+xml\r\nX-Timestamp:${ts}Z\r\nPath:ssml\r\n\r\n${ssml}`);
      };
      ws.onmessage = ev => {
        if (typeof ev.data === 'string') {
          if (ev.data.includes('Path:turn.end')) {
            if (!chunks.length) { done(reject, new Error('empty audio')); return; }
            const blob = new Blob(chunks, { type: 'audio/mp3' });
            done(resolve, URL.createObjectURL(blob));
          }
        } else {
          const view = new DataView(ev.data);
          const hl = view.getUint16(0);
          chunks.push(new Uint8Array(ev.data, 2 + hl));
        }
      };
      ws.onerror = () => done(reject, new Error('ws error'));
      ws.onclose = () => { if (!settled) done(reject, new Error('closed')); };
    } catch (e) { done(reject, e); }
  });
}

/* --- 播一句（自动缓存，重复播放零延迟） --- */
async function speakOne(text) {
  const v = curVoice();
  const ratePctRaw = Math.round((curRate() - 1) * 100);
  const ratePct = (ratePctRaw >= 0 ? '+' : '') + ratePctRaw + '%';

  if (v.id === '__local__') return localSpeak(text);

  const key = v.id + '|' + ratePct + '|' + text;
  let url = audioCache.get(key);
  if (!url) {
    try {
      url = await edgeSynth(text, v.id, ratePct);
      if (audioCache.size > 120) audioCache.clear();
      audioCache.set(key, url);
    } catch (err) {
      if (!useLocalFallback) {
        useLocalFallback = true;
        setStatus('⚠️ 在线发音连不上，已切换为系统本地发音');
      }
      return localSpeak(text);
    }
  }
  if (edgeAbort) return;
  return new Promise(res => {
    edgeAudio = new Audio(url);
    edgeAudio.onended = res;
    edgeAudio.onerror = res;
    edgeAudio.play().catch(res);
  });
}

/* --- 本地兜底 --- */
function refreshLocalVoices() {
  if (!('speechSynthesis' in window)) return;
  localVoices = speechSynthesis.getVoices().filter(v => /^en/i.test(v.lang));
}
if ('speechSynthesis' in window) {
  refreshLocalVoices();
  speechSynthesis.onvoiceschanged = refreshLocalVoices;
}
function localSpeak(text) {
  return new Promise(res => {
    if (!('speechSynthesis' in window)) return res();
    const u = new SpeechSynthesisUtterance(text);
    u.lang = 'en-US'; u.rate = curRate();
    if (localVoices.length) u.voice = localVoices[0];
    u.onend = res; u.onerror = res;
    speechSynthesis.speak(u);
  });
}

/* --- 播放控制 --- */
function markPlayBtn(on) {
  const b = document.getElementById('playBtn'); if (!b) return;
  b.textContent = on ? '⏸ 播放中…' : '▶ 播放';
  b.classList.toggle('playing', on);
}
function setStatus(s) { const el = document.getElementById('ttsStatus'); if (el) el.textContent = s; }
function togglePlay() { ttsPlaying ? stopTTS() : startTTS(); }

function startTTS() {
  const e = cur(); if (!e || ttsPlaying) return;
  ttsPlaying = true; edgeAbort = false; markPlayBtn(true);
  const mode = document.getElementById('ttsMode') ? document.getElementById('ttsMode').value : 'sent';
  const sents = sentences();
  const runFrom = async si => {
    if (!ttsPlaying || si >= sents.length) { stopTTS(); setStatus('✅ 播放完毕'); return; }
    highlightSent(si);
    for (let r = ttsRepeats; r > 0 && ttsPlaying; r--) {
      setStatus(`第 ${si + 1}/${sents.length} 句 · 剩 ${r} 次重复`);
      await speakOne(sents[si].text);
      if (!ttsPlaying) return;
      if (r > 1) await new Promise(z => setTimeout(z, 300));
    }
    setTimeout(() => runFrom(si + 1), mode === 'sent' ? 700 : 150);
  };
  runFrom(0);
}

function stopTTS() {
  ttsPlaying = false; edgeAbort = true;
  if (edgeWs) { try { edgeWs.close(); } catch (e) {} edgeWs = null; }
  if (edgeAudio) { edgeAudio.pause(); edgeAudio = null; }
  if ('speechSynthesis' in window) speechSynthesis.cancel();
  markPlayBtn(false);
  activeSent = -1;
  document.querySelectorAll('.sent-active').forEach(x => x.classList.remove('sent-active'));
  setStatus('');
}

function highlightSent(si) {
  activeSent = si;
  document.querySelectorAll('.sent-active').forEach(x => x.classList.remove('sent-active'));
  const list = sentences();
  if (!list[si]) return;
  document.querySelectorAll('#essayText .w').forEach(sp => {
    const wi = +sp.dataset.wi;
    if (!hiddenSet.has(wi) && list[si].idxs.includes(wi)) sp.classList.add('sent-active');
  });
  const act = document.querySelector('.sent-active');
  if (act) act.scrollIntoView({ block: 'center', behavior: 'smooth' });
}

function renderVoices() {
  const sel = document.getElementById('voiceSel'); if (!sel) return;
  sel.innerHTML = VOICES.map(v =>
    `<option value="${v.id}" ${v.id === 'en-US-AvaMultilingualNeural' ? 'selected' : ''}>${v.name}</option>`).join('');
  sel.value = useLocalFallback ? '__local__' : sel.value;
}

/* ================= 编辑页 ================= */
function renderEdit() {
  const e = cur();
  const main = document.getElementById('mainArea');
  if (!e) { main.innerHTML = '<div class="empty-tip">先新建一篇作文</div>'; return; }
  main.innerHTML = `
    <div class="top-bar">
      <button class="btn back-btn" onclick="backToList()">← 库</button>
      <h2>编辑作文</h2>
      <div class="tab-switch">
        <button class="${viewMode === 'study' ? 'on' : ''}" onclick="switchTab('study')">背诵</button>
        <button class="${viewMode === 'edit' ? 'on' : ''}" onclick="switchTab('edit')">编辑</button>
      </div>
    </div>
    <div class="panel"><div class="edit-form">
      <input type="text" id="editTitle" placeholder="标题，如：2020 英二大作文范文" value="${esc(e.title || '')}">
      <textarea id="editText" placeholder="把作文全文粘贴到这里…">${esc(e.text)}</textarea>
      <div class="edit-actions">
        <button class="btn primary" onclick="saveEdit()">💾 保存</button>
        <button class="btn danger" onclick="delEssay()">🗑 删除本文</button>
      </div>
    </div></div>
  `;
}
function saveEdit() {
  const e = cur(); if (!e) return;
  const t = document.getElementById('editTitle').value.trim();
  const x = document.getElementById('editText').value.trim();
  if (!x) { alert('正文不能为空'); return; }
  e.title = t || '未命名'; e.text = x;
  sentencesCache = null;
  save(); viewMode = 'study'; resetHide(); render();
}
function delEssay() {
  if (!confirm('确定删除这篇作文？此操作不可恢复。')) return;
  essays = essays.filter(x => x.id !== currentId);
  currentId = essays.length ? essays[0].id : null;
  save(); backToList();
}
function newEssay() {
  const e = { id: 'e' + Date.now(), title: '', text: '', createdAt: Date.now(), lastReview: null, level: 0 };
  essays.unshift(e); currentId = e.id; viewMode = 'edit';
  save(); openEssay();
}
function switchTab(m) {
  viewMode = m;
  if (m === 'study') { resetHide(); stopTTS(); }
  render();
}

/* ================= 导入 / 导出 ================= */
function exportData() {
  const blob = new Blob([JSON.stringify(essays, null, 2)], { type: 'application/json' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = '作文背诵助手数据.json';
  a.click();
}
function importJsonFile(input) {
  const f = input.files[0]; if (!f) return;
  const r = new FileReader();
  r.onload = () => {
    try {
      const d = JSON.parse(r.result);
      if (!Array.isArray(d)) throw 0;
      d.forEach(x => { if (!essays.some(e => e.id === x.id)) essays.push(x); });
      save(); render(); alert('导入成功');
    } catch (e) { alert('文件格式不对，需要本工具导出的 JSON'); }
  };
  r.readAsText(f); input.value = '';
}
function importTxtFile(input) {
  const f = input.files[0]; if (!f) return;
  const r = new FileReader();
  r.onload = () => {
    const e = { id: 'e' + Date.now(), title: f.name.replace(/\.txt$/i, ''), text: r.result.trim(),
      createdAt: Date.now(), lastReview: null, level: 0 };
    essays.unshift(e); currentId = e.id; viewMode = 'edit';
    save(); openEssay();
  };
  r.readAsText(f); input.value = '';
}

/* ================= 公共 ================= */
function esc(s) { return s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;'); }
function render() { renderList(); viewMode === 'study' ? renderStudy() : renderEdit(); }

else openEssay();
